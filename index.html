<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f5f5f5">
<title>Гойданем</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Гойданем">
<style>
  /* Токены Ant Design 5 (светлая тема) */
  :root {
    --color-primary: #1677ff;
    --color-primary-hover: #4096ff;
    --color-primary-active: #0958d9;
    --color-bg-layout: #f5f5f5;
    --color-bg-container: #ffffff;
    --color-fill: #f5f5f5;
    --color-fill-hover: rgba(0, 0, 0, .06);
    --color-border: #d9d9d9;
    --color-border-secondary: #f0f0f0;
    --color-text: rgba(0, 0, 0, .88);
    --color-text-secondary: rgba(0, 0, 0, .65);
    --color-text-tertiary: rgba(0, 0, 0, .45);
    --gold-bg: #fffbe6;
    --gold-border: #ffe58f;
    --gold-text: #d48806;
    --radius: 6px;
    --radius-lg: 8px;
    --shadow-card: 0 1px 2px 0 rgba(0,0,0,.03), 0 1px 6px -1px rgba(0,0,0,.02), 0 2px 4px 0 rgba(0,0,0,.02);
    --shadow-segment: 0 1px 2px 0 rgba(0,0,0,.03), 0 1px 4px -1px rgba(0,0,0,.02), 0 2px 4px 0 rgba(0,0,0,.02);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--color-bg-layout);
    color: var(--color-text);
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.5715;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  .app {
    height: 100dvh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 16px;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    max-width: 560px;
    margin: 0 auto;
  }
  .side { display: flex; flex-direction: column; gap: 8px; }
  .side.top { transform: rotate(180deg); }

  /* Button type="primary" size="large" block */
  .roll {
    height: min(15dvh, 112px);
    min-height: 80px;
    border: 1px solid transparent;
    border-radius: 12px;
    background: var(--color-primary);
    color: #fff;
    font: 600 30px/1 var(--font);
    box-shadow: 0 2px 0 rgba(5, 145, 255, .1);
    cursor: pointer;
    transition: background .2s cubic-bezier(.645,.045,.355,1);
  }
  .roll:hover { background: var(--color-primary-hover); }
  .roll:active { background: var(--color-primary-active); }
  .roll:focus-visible { outline: 4px solid #91caff; outline-offset: 1px; }

  /* Segmented block */
  .count {
    display: flex;
    padding: 2px;
    border-radius: var(--radius-lg);
    background: var(--color-fill);
    box-shadow: inset 0 0 0 1px var(--color-border-secondary);
  }
  .count button {
    flex: 1;
    min-height: 32px;
    border: none;
    border-radius: var(--radius);
    background: transparent;
    color: var(--color-text-secondary);
    font: 14px/1 var(--font);
    cursor: pointer;
    transition: color .2s, background .2s;
  }
  .count button:hover { color: var(--color-text); background: var(--color-fill-hover); }
  .count button[aria-pressed="true"] {
    background: var(--color-bg-container);
    color: var(--color-text);
    box-shadow: var(--shadow-segment);
  }

  /* Card */
  .table {
    border-radius: var(--radius-lg);
    background: var(--color-bg-container);
    border: 1px solid var(--color-border-secondary);
    box-shadow: var(--shadow-card);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .result { display: flex; flex-direction: column; align-items: center; gap: 20px; }
  .result.facing-top { transform: rotate(180deg); }
  .dice { display: flex; gap: 16px; }

  .die {
    --s: min(41vw, 27dvh, 200px);
    width: var(--s);
    height: var(--s);
    background: var(--color-bg-container);
    border: 1px solid var(--color-border);
    border-radius: 16%;
    box-shadow: 0 6px 16px 0 rgba(0,0,0,.08), 0 3px 6px -4px rgba(0,0,0,.12), 0 9px 28px 8px rgba(0,0,0,.05);
    display: grid;
    grid-template: repeat(3, 1fr) / repeat(3, 1fr);
    padding: 10%;
  }
  .pip {
    width: 80%;
    height: 80%;
    margin: auto;
    border-radius: 50%;
    background: var(--color-primary);
    visibility: hidden;
  }
  .pip.on { visibility: visible; }

  /* Typography + Tag */
  .caption {
    min-height: 28px;
    display: flex;
    align-items: center;
    font-size: 20px;
    font-weight: 600;
    line-height: 1.4;
  }
  .caption .hint { font-size: 14px; font-weight: 400; color: var(--color-text-tertiary); }
  .caption .tag {
    margin-left: 8px;
    padding: 0 7px;
    font-size: 12px;
    font-weight: 400;
    line-height: 20px;
    border-radius: 4px;
    background: var(--gold-bg);
    border: 1px solid var(--gold-border);
    color: var(--gold-text);
  }
</style>
</head>
<body>
<div class="app">
  <div class="side top">
    <button class="roll" data-player="top">Бросить</button>
    <div class="count" role="group" aria-label="Количество кубиков"></div>
  </div>

  <div class="table">
    <div class="result" id="result">
      <div class="dice" id="dice"></div>
      <div class="caption" id="caption"><span class="hint">Нажми «Бросить»</span></div>
    </div>
  </div>

  <div class="side bottom">
    <div class="count" role="group" aria-label="Количество кубиков"></div>
    <button class="roll" data-player="bottom">Бросить</button>
  </div>
</div>

<script>
  // Какие ячейки 3×3 закрашены для каждого значения
  const PIPS = {
    1: [4],
    2: [2, 6],
    3: [2, 4, 6],
    4: [0, 2, 6, 8],
    5: [0, 2, 4, 6, 8],
    6: [0, 2, 3, 5, 6, 8],
  };

  const diceEl = document.getElementById('dice');
  const resultEl = document.getElementById('result');
  const captionEl = document.getElementById('caption');
  const rollButtons = document.querySelectorAll('.roll');
  const countGroups = document.querySelectorAll('.count');

  let diceCount = 2;
  try { diceCount = Number(localStorage.getItem('diceCount')) === 1 ? 1 : 2; } catch (e) {}

  function randomFace() {
    const buf = new Uint32Array(1);
    // Отбрасываем хвост, чтобы распределение было ровным
    const limit = Math.floor(0x100000000 / 6) * 6;
    do { crypto.getRandomValues(buf); } while (buf[0] >= limit);
    return (buf[0] % 6) + 1;
  }

  function makeDie(value) {
    const die = document.createElement('div');
    die.className = 'die';
    die.setAttribute('aria-label', String(value));
    for (let i = 0; i < 9; i++) {
      const pip = die.appendChild(document.createElement('div'));
      pip.className = PIPS[value].includes(i) ? 'pip on' : 'pip';
    }
    return die;
  }

  function renderDice(values) {
    diceEl.replaceChildren(...values.map(makeDie));
  }

  function showHint() {
    captionEl.innerHTML = '<span class="hint">Нажми «Бросить»</span>';
  }

  function renderCountControls() {
    countGroups.forEach(group => {
      group.replaceChildren(...[1, 2].map(n => {
        const b = document.createElement('button');
        b.textContent = n === 1 ? '1 кубик' : '2 кубика';
        b.setAttribute('aria-pressed', String(n === diceCount));
        b.addEventListener('click', () => setCount(n));
        return b;
      }));
    });
  }

  function setCount(n) {
    if (n === diceCount) return;
    diceCount = n;
    try { localStorage.setItem('diceCount', String(n)); } catch (e) {}
    renderCountControls();
    renderDice(Array.from({ length: n }, () => 6));
    showHint();
  }

  function roll(player) {
    const final = Array.from({ length: diceCount }, randomFace);
    resultEl.classList.toggle('facing-top', player === 'top');
    renderDice(final);
    if (navigator.vibrate) navigator.vibrate(30);

    captionEl.textContent = final.join(' : ');
    if (final.length === 2 && final[0] === final[1]) {
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = 'Дубль';
      captionEl.appendChild(tag);
    }
  }

  rollButtons.forEach(b => b.addEventListener('click', () => roll(b.dataset.player)));

  renderCountControls();
  renderDice(Array.from({ length: diceCount }, () => 6));

  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
</html>
